name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# zig-klient depends on zig-yaml via a relative path (../zig-yaml in build.zig.zon),
# so we check it out as a sibling directory. zig-protobuf is fetched by `zig build`
# from its pinned git URL.
jobs:
  build-test:
    name: Build & Test (Zig 0.16.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zig-klient
        uses: actions/checkout@v4
        with:
          path: zig-klient

      - name: Checkout zig-yaml (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: guanchzhou/zig-yaml
          path: zig-yaml

      - name: Install Zig 0.16.0
        run: |
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          sha="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl -fsSL "$url" -o zig.tar.xz
          echo "$sha  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Verify Zig
        run: zig version

      - name: Build
        working-directory: zig-klient
        run: zig build

      - name: Unit tests
        working-directory: zig-klient
        run: zig build test

      - name: Compile integration entrypoints
        working-directory: zig-klient
        run: zig build build-integration-tests
