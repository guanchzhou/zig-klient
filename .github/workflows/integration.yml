name: Integration (kind)

# Live integration against a real Kubernetes cluster (kind). Runs on demand and
# nightly to keep PR latency low — the per-PR CI only compiles the entrypoints.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  kind-integration:
    name: Live integration on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          # kind node image — bump as kind ships newer Kubernetes.
          node_image: kindest/node:v1.33.1

      - name: Build integration entrypoints
        run: zig build build-integration-tests

      - name: Start kubectl proxy (allow exec/attach)
        run: |
          kubectl proxy --port=8080 --reject-paths='^$' &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done

      - name: Create exec target pod
        run: |
          kubectl run zig-klient-exec-test --image=busybox:1.36 --restart=Never \
            --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/zig-klient-exec-test --timeout=120s

      - name: Resource CRUD + list (via proxy)
        run: zig build test-via-proxy

      - name: Pod exec over WebSocket
        run: zig build test-pod-exec

      - name: ListClient fixture scenarios
        run: zig build test-list-client -Dh2=true

      - name: ListClient Pod protobuf and CRD JSON
        run: |
          kubectl apply -f tests/fixtures/widget-crd.yaml
          kubectl wait --for=condition=Established crd/widgets.example.com --timeout=90s
          kubectl apply -f - <<'EOF'
          apiVersion: example.com/v1
          kind: Widget
          metadata:
            name: demo
          EOF
          for _ in $(seq 1 30); do
            if kubectl get widgets.example.com >/dev/null 2>&1; then break; fi
            sleep 2
          done
          zig build h2-spike -Dh2=true -- --lists 1 --path /api/v1/pods --connect-timeout-ms 10000 | tee /tmp/pods.txt
          grep -q 'application/vnd.kubernetes.protobuf' /tmp/pods.txt
          zig build h2-spike -Dh2=true -- --lists 1 --path /apis/example.com/v1/widgets --connect-timeout-ms 10000 | tee /tmp/widgets.txt
          grep -q 'application/json' /tmp/widgets.txt

      # MutatingAdmissionPolicy requires K8s >= 1.36; enable once kind ships a 1.36
      # node image:
      # - name: MutatingAdmissionPolicy CRUD
      #   run: zig build test-mutating-admission-policy
