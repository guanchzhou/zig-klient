name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # keyless cosign signing via OIDC

# Dependencies are git-pinned in build.zig.zon and fetched by `zig build`.
jobs:
  release:
    name: Build, test & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Build & test
        run: |
          zig build
          zig build test

      - name: Extract changelog section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Print the body between this version's heading and the next "## " heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release $TAG" > release-notes.md; fi

      - name: Generate checksums
        run: shasum -a 256 sbom.cdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (keyless)
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          cosign sign-blob --yes --bundle sbom.cdx.json.cosign.bundle sbom.cdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            sbom.cdx.json
            SHA256SUMS
            SHA256SUMS.cosign.bundle
            sbom.cdx.json.cosign.bundle
          fail_on_unmatched_files: true
